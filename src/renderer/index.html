<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' forge-ext:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:"
    />
    <title>Forge</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="forge-logo" viewBox="0 0 256 256"><defs><linearGradient id="fl-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16363f"/><stop offset="1" stop-color="#0a1a20"/></linearGradient><linearGradient id="fl-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ad4b3"/><stop offset="1" stop-color="#00a896"/></linearGradient><linearGradient id="fl-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fbf8"/><stop offset="1" stop-color="#7fe5d3"/></linearGradient><linearGradient id="fl-ember" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ffd36b"/></linearGradient></defs><rect width="256" height="256" rx="58" fill="url(#fl-dark)"/><path d="M128 36 L206 80 V176 L128 220 L50 176 V80Z" fill="none" stroke="url(#fl-teal)" stroke-width="13" stroke-linejoin="round"/><path d="M96 92 H172 V114 H122 V130 H160 V150 H122 V176 H96Z" fill="url(#fl-steel)"/><path d="M176 62 Q178.5 81.5 198 84 Q178.5 86.5 176 106 Q173.5 86.5 154 84 Q173.5 81.5 176 62Z" fill="url(#fl-ember)"/></symbol></svg>
    <div id="aurora"></div>
    <header id="toolbar">
      <svg class="logo" viewBox="0 0 256 256" role="img" aria-label="Forge"><use href="#forge-logo"/></svg>
      <button class="widget" id="project-widget" title="Open folder (Ctrl+O)">
        <span id="project-name">No project</span><span class="chev" id="project-chev"></span>
      </button>
      <button class="widget" id="branch-widget" hidden title="Git branch">
        <span id="branch-icon"></span><span id="branch-name"></span>
      </button>
      <span class="nav-group">
        <button class="icon-btn small" id="nav-back" title="Back (Ctrl+Alt+Left)" disabled></button>
        <button class="icon-btn small" id="nav-forward" title="Forward (Ctrl+Alt+Right)" disabled></button>
      </span>
      <span class="grow"></span>
      <button class="search-pill" id="search-btn" title="Search Everywhere (Shift Shift)"><span class="ico" id="search-ico"></span><span class="lbl">Search everywhere</span><span class="keys"><kbd>Shift</kbd><kbd>Shift</kbd></span></button>
      <span class="grow"></span>
      <div class="run-group">
        <button class="widget" id="run-config" title="Run configuration"><span id="run-config-name">Current File</span><span class="chev" id="run-config-chev"></span></button>
        <button class="icon-btn run" id="run-btn" title="Run (Shift+F10)"></button>
        <button class="icon-btn" id="debug-btn" title="Debug (Shift+F9)"></button>
        <button class="icon-btn" id="stop-btn" title="Stop (Ctrl+F2)" disabled></button>
      </div>
      <button class="icon-btn" id="palette-btn" title="Command Palette (Ctrl+Shift+P)"></button>
      <button class="icon-btn" id="settings-btn" title="Settings (Ctrl+,)"></button>
    </header>
    <div id="app">
      <nav id="stripe" aria-label="Tool windows"><div class="stripe-top" id="stripe-left-top"></div><span class="spacer"></span><div class="stripe-bot" id="stripe-left-bottom"></div></nav>
      <aside id="project" class="island">
        <div class="tw-header">
          <div class="dock-tabs" id="side-tabs"></div>
          <button class="icon-btn small" data-hide="left" title="Hide"></button>
        </div>
        <div id="project-view" class="view">
          <div class="tool-bar" id="tree-bar"></div>
          <div id="tree">
            <div class="empty-tree" id="empty-tree"><p>No folder is open</p><button class="btn-primary" id="open-folder-btn">Open Folder…</button></div>
          </div>
        </div>
        <div id="commit-view" hidden>
          <div id="commit-head">
            <span id="commit-summary"></span>
            <span class="actions">
              <button class="icon-btn small" id="commit-pull" title="Pull (fast-forward only)"></button>
              <button class="icon-btn small" id="commit-push" title="Push"></button>
              <button class="icon-btn small" id="commit-stash" title="Stash"></button>
              <button class="icon-btn small" id="commit-refresh" title="Refresh"></button>
            </span>
          </div>
          <div id="commit-list"></div>
          <div id="commit-foot">
            <textarea id="commit-msg" placeholder="Commit message" spellcheck="false"></textarea>
            <label class="amend"><input type="checkbox" id="commit-amend" /> Amend previous commit</label>
            <div class="commit-actions">
              <button class="btn" id="commit-ai-btn" title="Write the commit message from the ticked changes with AI">Generate message</button>
              <button id="commit-btn">Commit</button>
              <button class="btn" id="commit-push-btn" title="Commit, then push">Commit &amp; Push</button>
            </div>
          </div>
        </div>
      </aside>
      <div class="splitter v" id="split-project"></div>
      <section id="center">
        <main id="editor-area" class="island">
          <div id="tabs"></div>
          <div id="breadcrumbs" hidden></div>
          <div id="editors">
            <div id="pane1">
              <div id="editor"></div>
              <div id="image-view" hidden></div>
              <div id="diff" hidden></div>
            </div>
            <div class="splitter v" id="split-editors" hidden></div>
            <div id="pane2" hidden>
              <div id="pane2-head">
                <span id="pane2-name"></span>
                <span class="grow"></span>
                <button class="icon-btn small" id="pane2-swap" title="Show this file in the main editor">⇄</button>
                <button class="icon-btn small" id="pane2-close" title="Close the split">✕</button>
              </div>
              <div id="editor2"></div>
            </div>
          </div>
          <div id="welcome">
            <div class="w-hero">
              <svg class="w-logo" viewBox="0 0 256 256" role="img" aria-label="Forge"><use href="#forge-logo"/></svg>
              <div class="w-title">Forge</div>
              <div class="w-sub">Open a folder to start coding</div>
            </div>
            <div class="w-cols">
              <div class="w-col">
                <div class="w-actions">
                  <button class="w-action" id="w-open"><span class="wi" data-ico="folder"></span>Open Folder<span class="keys"><kbd>Ctrl</kbd><kbd>O</kbd></span></button>
                  <button class="w-action" id="w-search"><span class="wi" data-ico="search"></span>Search Everywhere<span class="keys"><kbd>Shift</kbd><kbd>Shift</kbd></span></button>
                  <button class="w-action" id="w-palette"><span class="wi" data-ico="command"></span>Command Palette<span class="keys"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>P</kbd></span></button>
                  <button class="w-action" id="w-settings"><span class="wi" data-ico="gear"></span>Settings &amp; Themes<span class="keys"><kbd>Ctrl</kbd><kbd>,</kbd></span></button>
                </div>
                <div id="recents"></div>
              </div>
              <div class="w-col w-tips">
                <h4>Handy shortcuts</h4>
                <div class="w-row"><span>Toggle Project</span><span><kbd>Alt</kbd><kbd>1</kbd></span></div>
                <div class="w-row"><span>Toggle Output</span><span><kbd>Alt</kbd><kbd>2</kbd></span></div>
                <div class="w-row"><span>Terminal</span><span><kbd>Alt</kbd><kbd>3</kbd></span></div>
                <div class="w-row"><span>Problems</span><span><kbd>Alt</kbd><kbd>6</kbd></span></div>
                <div class="w-row"><span>Structure</span><span><kbd>Alt</kbd><kbd>7</kbd></span></div>
                <div class="w-row"><span>Find in Project</span><span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>F</kbd></span></div>
                <div class="w-row"><span>Run / Debug</span><span><kbd>Shift</kbd><kbd>F10</kbd> <kbd>Shift</kbd><kbd>F9</kbd></span></div>
              </div>
            </div>
          </div>
        </main>
        <div class="splitter h" id="split-bottom"></div>
        <section id="bottom" class="island">
          <div class="tw-header">
            <div class="dock-tabs" id="bottom-tabs"></div>
            <button class="icon-btn small" data-hide="bottom" title="Hide"></button>
          </div>
          <div id="view-output" class="view"><div id="log"></div></div>
          <div id="view-git" class="view" hidden></div>
          <div id="view-http" class="view" hidden></div>
          <div id="view-breakpoints" class="view" hidden></div>
          <div id="view-problems" class="view" hidden></div>
          <div id="view-hierarchy" class="view" hidden></div>
          <div id="view-ai" class="view" hidden></div>
          <div id="view-db" class="view" hidden></div>
          <div id="view-viewer" class="view" hidden></div>
          <div id="view-github" class="view" hidden></div>
          <div id="view-docker" class="view" hidden></div>
          <div id="view-deps" class="view" hidden></div>
          <div id="view-dup" class="view" hidden></div>
          <div id="view-npm" class="view" hidden></div>
          <div id="view-tests" class="view" hidden></div>
          <div id="view-todo" class="view" hidden></div>
          <div id="view-terminal" class="view" hidden>
            <div id="term-tabs"></div>
            <div id="term"></div>
          </div>
          <div id="view-run" class="view" hidden><div id="run-term"></div></div>
          <div id="view-debug" class="view" hidden>
            <div id="dbg-bar">
              <button class="icon-btn small" data-dbg="resume" title="Resume (F9)"></button>
              <button class="icon-btn small" data-dbg="stepOver" title="Step Over (F8)"></button>
              <button class="icon-btn small" data-dbg="stepInto" title="Step Into (F7)"></button>
              <button class="icon-btn small" data-dbg="stepOut" title="Step Out (Shift+F8)"></button>
              <button class="icon-btn small" data-dbg="stop" title="Stop (Ctrl+F2)"></button>
              <span id="dbg-status"></span>
            </div>
            <div id="dbg-body">
              <div id="dbg-frames" class="dbg-pane"></div>
              <div id="dbg-mid">
                <div id="dbg-vars" class="dbg-pane"></div>
                <div id="dbg-watch" class="dbg-pane">
                  <div class="wh">Watches</div>
                  <div id="dbg-watch-list"></div>
                  <input id="dbg-watch-input" placeholder="Add a watch (Enter)" spellcheck="false" autocomplete="off" />
                </div>
              </div>
              <div id="dbg-eval" class="dbg-pane">
                <div id="dbg-log"></div>
                <input id="dbg-input" placeholder="Evaluate expression (Enter)" spellcheck="false" autocomplete="off" />
              </div>
            </div>
          </div>
          <div id="view-find" class="view" hidden>
            <div id="find-bar">
              <input id="find-input" placeholder="Find in project (Enter)" spellcheck="false" autocomplete="off" />
              <button class="chip" id="find-case" title="Match case">Aa</button>
              <button class="chip" id="find-word" title="Whole words only">W</button>
              <button class="chip" id="find-regex" title="Regular expression">.*</button>
              <input id="find-mask" class="field" placeholder="File mask: *.ts, src/**" spellcheck="false" autocomplete="off" />
              <span id="find-count"></span>
            </div>
            <div id="replace-bar">
              <input id="find-replace" class="field" placeholder="Replace with" spellcheck="false" autocomplete="off" />
              <button class="btn" id="find-replace-all">Replace All</button>
            </div>
            <div id="find-results"></div>
          </div>
        </section>
      </section>
      <div class="splitter v" id="split-right" hidden></div>
      <aside id="right" class="island" hidden>
        <div class="tw-header">
          <div class="dock-tabs" id="right-tabs"></div>
          <button class="icon-btn small" data-hide="right" title="Hide"></button>
        </div>
        <div id="view-structure" class="view" hidden></div>
        <div id="view-bookmarks" class="view" hidden></div>
        <div id="view-preview" class="view" hidden></div>
      </aside>
      <nav id="stripe-right" aria-label="Tool windows (right)" hidden></nav>
    </div>
    <footer id="status">
      <span id="status-msg" role="status" aria-live="polite"></span>
      <span class="sw" id="st-blame"></span>
      <span class="sw" id="st-problems" title="Problems from the language server"></span>
      <span class="grow"></span>
      <span class="sw" id="st-pos"></span>
      <span class="sw" id="st-eol"></span>
      <span class="sw" id="st-enc">UTF-8</span>
      <span class="sw" id="st-indent"></span>
      <span class="sw" id="st-lang"></span>
      <span class="sw" id="st-bell" title="Notifications"></span>
    </footer>
    <div id="search" class="overlay" hidden>
      <div id="search-box" class="modal" role="dialog" aria-modal="true" aria-label="Search Everywhere">
        <div id="search-scopes"></div>
        <input id="search-input" placeholder="Search files by name" spellcheck="false" autocomplete="off" />
        <div id="search-results"></div>
      </div>
    </div>
    <div id="quick" class="overlay" hidden>
      <div id="quick-box" class="modal" role="dialog" aria-modal="true" aria-labelledby="quick-title">
        <div id="quick-title"></div>
        <input id="quick-input" aria-labelledby="quick-title" spellcheck="false" autocomplete="off" />
        <div id="quick-results"></div>
      </div>
    </div>
    <div id="palette" class="overlay" hidden>
      <div id="palette-box" class="modal" role="dialog" aria-modal="true" aria-label="Command palette">
        <input id="palette-input" placeholder="Type a command…" spellcheck="false" autocomplete="off" />
        <div id="palette-results"></div>
      </div>
    </div>
    <div id="settings" class="overlay" hidden>
      <div id="settings-box" class="modal" role="dialog" aria-modal="true" aria-label="Settings">
        <nav id="settings-nav"></nav>
        <section id="settings-main">
          <div id="settings-top">
            <input id="settings-search" class="field" placeholder="Search settings…" spellcheck="false" autocomplete="off" />
          </div>
          <div id="settings-body"></div>
          <div id="settings-foot">
            <span class="left" id="settings-note"></span>
            <span>
              <button class="btn" id="settings-reset-all">Reset all</button>
              <button class="btn" id="settings-open-file">Open settings.json</button>
              <button class="btn-primary" id="settings-close">Done</button>
            </span>
          </div>
        </section>
      </div>
    </div>
    <div id="runcfg" class="overlay" hidden>
      <div id="runcfg-box" class="modal" role="dialog" aria-modal="true" aria-label="Run configurations">
        <div id="runcfg-side">
          <div id="runcfg-tools">
            <button class="icon-btn small" id="runcfg-add" title="Add a configuration">＋</button>
            <button class="icon-btn small" id="runcfg-dup" title="Duplicate">⧉</button>
            <button class="icon-btn small" id="runcfg-del" title="Remove">－</button>
          </div>
          <div id="runcfg-list"></div>
        </div>
        <div id="runcfg-main">
          <div id="runcfg-form"></div>
          <div id="runcfg-error"></div>
          <div id="runcfg-foot">
            <button class="btn" id="runcfg-json">Open run.json</button>
            <span class="grow"></span>
            <button class="btn" id="runcfg-cancel">Cancel</button>
            <button class="btn-primary" id="runcfg-save">Save</button>
          </div>
        </div>
      </div>
    </div>
    <div id="toasts"></div>
    <div id="ctx" hidden></div>
    <div id="ask" class="overlay" hidden>
      <form id="ask-box" class="modal" role="dialog" aria-modal="true" aria-labelledby="ask-title">
        <div id="ask-title"></div>
        <input id="ask-input" spellcheck="false" autocomplete="off" />
        <div id="ask-hint">Enter to confirm &middot; Esc to cancel</div>
      </form>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
