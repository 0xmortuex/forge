<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:"
    />
    <title>Forge</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <nav id="stripe">
        <button class="tw-btn active" data-tw="project" title="Project (Alt+1)">Project</button>
        <span class="spacer"></span>
        <button class="tw-btn active" data-tw="output" title="Output (Alt+2)">Output</button>
      </nav>
      <aside id="project"><div class="tw-header">Project</div><div id="tree"></div></aside>
      <div class="splitter v" id="split-project"></div>
      <section id="center">
        <main id="editor-area">
          <div id="tabs"></div>
          <div id="editor"></div>
          <div id="welcome">Open a folder with <kbd>Ctrl</kbd>+<kbd>O</kbd> &middot; Search files with <kbd>Shift</kbd> <kbd>Shift</kbd></div>
        </main>
        <div class="splitter h" id="split-output"></div>
        <section id="output"><div class="tw-header">Output</div><div id="log"></div></section>
      </section>
    </div>
    <footer id="status"><span id="status-msg"></span><span id="status-pos"></span></footer>
    <div id="search" hidden>
      <div id="search-box">
        <input id="search-input" placeholder="Search files by name" spellcheck="false" autocomplete="off" />
        <div id="search-results"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
