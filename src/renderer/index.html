<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:"
    />
    <title>Forge</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="logo">F</div>
      <button class="widget" id="project-widget" title="Open folder (Ctrl+O)">
        <span id="project-name">No project</span><span class="chev" id="project-chev"></span>
      </button>
      <button class="widget" id="branch-widget" hidden title="Git branch">
        <span id="branch-icon"></span><span id="branch-name"></span>
      </button>
      <span class="grow"></span>
      <button class="widget" id="run-config" title="Run configuration"><span id="run-config-name">Current File</span><span class="chev" id="run-config-chev"></span></button>
      <button class="icon-btn run" id="run-btn" title="Run (Shift+F10)"></button>
      <button class="icon-btn" id="debug-btn" title="Debug (Shift+F9)"></button>
      <button class="icon-btn" id="stop-btn" title="Stop (Ctrl+F2)" disabled></button>
      <button class="icon-btn" id="search-btn" title="Search Everywhere (Shift Shift)"></button>
    </header>
    <div id="app">
      <nav id="stripe">
        <button class="tw-btn active" data-side="project" title="Project (Alt+1)"></button>
        <button class="tw-btn" data-side="commit" title="Commit (Alt+0)"></button>
        <span class="spacer"></span>
        <button class="tw-btn" data-view="debug" title="Debug"></button>
        <button class="tw-btn" data-view="run" title="Run (Shift+F10)"></button>
        <button class="tw-btn" data-view="find" title="Find in Project (Ctrl+Shift+F)"></button>
        <button class="tw-btn" data-view="terminal" title="Terminal (Alt+3)"></button>
        <button class="tw-btn active" data-view="output" title="Output (Alt+2)"></button>
      </nav>
      <aside id="project" class="island">
        <div class="tw-header">
          <div id="side-tabs">
            <button class="btab" data-side="project">Project</button>
            <button class="btab" data-side="commit">Commit</button>
          </div>
          <button class="icon-btn small" data-hide="project" title="Hide"></button>
        </div>
        <div id="tree"></div>
        <div id="commit-view" hidden>
          <div id="commit-head"><span id="commit-summary"></span><button class="icon-btn small" id="commit-refresh" title="Refresh"></button></div>
          <div id="commit-list"></div>
          <div id="commit-foot">
            <textarea id="commit-msg" placeholder="Commit message" spellcheck="false"></textarea>
            <button id="commit-btn">Commit</button>
          </div>
        </div>
      </aside>
      <div class="splitter v" id="split-project"></div>
      <section id="center">
        <main id="editor-area" class="island">
          <div id="tabs"></div>
          <div id="editor"></div>
          <div id="diff" hidden></div>
          <div id="welcome">
            <div class="w-title">Forge</div>
            <div class="w-row"><span>Open a folder</span><span><kbd>Ctrl</kbd><kbd>O</kbd></span></div>
            <div class="w-row"><span>Search Everywhere</span><span><kbd>Shift</kbd><kbd>Shift</kbd></span></div>
            <div class="w-row"><span>Toggle Project</span><span><kbd>Alt</kbd><kbd>1</kbd></span></div>
            <div class="w-row"><span>Toggle Output</span><span><kbd>Alt</kbd><kbd>2</kbd></span></div>
            <div class="w-row"><span>Terminal</span><span><kbd>Alt</kbd><kbd>3</kbd></span></div>
            <div class="w-row"><span>Find in Project</span><span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>F</kbd></span></div>
          </div>
        </main>
        <div class="splitter h" id="split-bottom"></div>
        <section id="bottom" class="island">
          <div class="tw-header">
            <div id="bottom-tabs">
              <button class="btab" data-view="output">Output</button>
              <button class="btab" data-view="terminal">Terminal</button>
              <button class="btab" data-view="find">Find</button>
              <button class="btab" data-view="run">Run</button>
              <button class="btab" data-view="debug">Debug</button>
            </div>
            <button class="icon-btn small" data-hide="bottom" title="Hide"></button>
          </div>
          <div id="view-output" class="view"><div id="log"></div></div>
          <div id="view-terminal" class="view" hidden>
            <div id="term-tabs"></div>
            <div id="term"></div>
          </div>
          <div id="view-run" class="view" hidden><div id="run-term"></div></div>
          <div id="view-debug" class="view" hidden>
            <div id="dbg-bar">
              <button class="icon-btn small" data-dbg="resume" title="Resume (F9)"></button>
              <button class="icon-btn small" data-dbg="stepOver" title="Step Over (F8)"></button>
              <button class="icon-btn small" data-dbg="stepInto" title="Step Into (F7)"></button>
              <button class="icon-btn small" data-dbg="stepOut" title="Step Out (Shift+F8)"></button>
              <button class="icon-btn small" data-dbg="stop" title="Stop (Ctrl+F2)"></button>
              <span id="dbg-status"></span>
            </div>
            <div id="dbg-body">
              <div id="dbg-frames" class="dbg-pane"></div>
              <div id="dbg-vars" class="dbg-pane"></div>
              <div id="dbg-eval" class="dbg-pane">
                <div id="dbg-log"></div>
                <input id="dbg-input" placeholder="Evaluate expression (Enter)" spellcheck="false" autocomplete="off" />
              </div>
            </div>
          </div>
          <div id="view-find" class="view" hidden>
            <div id="find-bar">
              <input id="find-input" placeholder="Find in project (Enter)" spellcheck="false" autocomplete="off" />
              <span id="find-count"></span>
            </div>
            <div id="find-results"></div>
          </div>
        </section>
      </section>
    </div>
    <footer id="status">
      <span id="status-msg"></span>
      <span class="sw" id="st-blame"></span>
      <span class="sw" id="st-problems" title="Problems from the language server"></span>
      <span class="grow"></span>
      <span class="sw" id="st-pos"></span>
      <span class="sw" id="st-eol"></span>
      <span class="sw" id="st-enc">UTF-8</span>
      <span class="sw" id="st-indent"></span>
      <span class="sw" id="st-lang"></span>
    </footer>
    <div id="search" hidden>
      <div id="search-box">
        <input id="search-input" placeholder="Search files by name" spellcheck="false" autocomplete="off" />
        <div id="search-results"></div>
      </div>
    </div>
    <div id="ctx" hidden></div>
    <div id="ask" hidden>
      <form id="ask-box">
        <div id="ask-title"></div>
        <input id="ask-input" spellcheck="false" autocomplete="off" />
        <div id="ask-hint">Enter to confirm &middot; Esc to cancel</div>
      </form>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
